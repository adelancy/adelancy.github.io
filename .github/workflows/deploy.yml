name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allows running this workflow manually from the Actions tab.
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; queue new pushes rather than cancelling
# an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs `npm run gen` via prebuild, regenerating data/site.json and
      # public/feed.xml from _config.yml before exporting to ./out.
      - name: Build static site
        run: npm run build

      # Runs after the build: next-env.d.ts is gitignored and regenerated by
      # `next build`, so a bare tsc before that step would fail on a fresh clone.
      - name: Type check
        run: npx tsc --noEmit

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
